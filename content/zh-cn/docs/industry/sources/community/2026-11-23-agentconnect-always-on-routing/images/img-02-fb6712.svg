<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>

  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">The same workflow drawn twice: an on-call engineer vs. router → worker</text>

  <!-- column headers -->
  <text x="282" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#9a3412">On-call engineer</text>
  <text x="918" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#134e4a">Agent (AgentConnect example)</text>

  <!-- row labels -->
  <g fill="#64748b" font-size="12.5">
    <text x="600" y="150" text-anchor="middle">Inputs</text>
    <text x="600" y="258" text-anchor="middle">Triage</text>
    <text x="600" y="366" text-anchor="middle">Active work</text>
    <text x="600" y="474" text-anchor="middle">Memory</text>
    <text x="600" y="566" text-anchor="middle">Replies</text>
  </g>

  <!-- HUMAN column -->
  <g transform="translate(22,100)">
    <!-- inputs -->
    <rect x="0" y="20" width="150" height="40" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="75" y="45" text-anchor="middle" fill="#431407" font-size="12">Bob: review PR #412</text>
    <rect x="172" y="20" width="160" height="40" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="252" y="45" text-anchor="middle" fill="#431407" font-size="12">Alice: payment rollback</text>
    <rect x="354" y="20" width="166" height="40" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="437" y="45" text-anchor="middle" fill="#431407" font-size="12">Channel: "+ billing"</text>

    <!-- attention -->
    <rect x="50" y="120" width="420" height="62" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="260" y="145" text-anchor="middle" fill="#7c2d12" font-weight="600" font-size="13.5">Attention: which task is this? Act now?</text>
    <text x="260" y="168" text-anchor="middle" fill="#9a3412" font-size="12">Keeps a mental index, not every log line or diff</text>
    <line x1="75" y1="60" x2="180" y2="118" stroke="#6b7280" stroke-width="1.5" marker-end="url(#b)"/>
    <line x1="252" y1="60" x2="256" y2="118" stroke="#6b7280" stroke-width="1.5" marker-end="url(#b)"/>
    <line x1="437" y1="60" x2="340" y2="118" stroke="#6b7280" stroke-width="1.5" marker-end="url(#b)"/>

    <!-- things in hand -->
    <rect x="12" y="232" width="152" height="60" rx="10" fill="#ffffff" stroke="#fdba74"/>
    <text x="88" y="256" text-anchor="middle" fill="#431407" font-size="13.5">Review PR #412</text>
    <text x="88" y="276" text-anchor="middle" fill="#9a3412" font-size="11.5">Read diff, wait on CI</text>
    <rect x="184" y="232" width="152" height="60" rx="10" fill="#ffffff" stroke="#fdba74"/>
    <text x="260" y="256" text-anchor="middle" fill="#431407" font-size="13.5">Payment rollback</text>
    <text x="260" y="276" text-anchor="middle" fill="#9a3412" font-size="11.5">Check logs, wait on ops</text>
    <rect x="356" y="232" width="152" height="60" rx="10" fill="#ffffff" stroke="#fdba74" stroke-dasharray="5 3"/>
    <text x="432" y="256" text-anchor="middle" fill="#431407" font-size="13.5">Routine patrol</text>
    <text x="432" y="276" text-anchor="middle" fill="#9a3412" font-size="11.5">Check on timer or alert</text>
    <line x1="185" y1="182" x2="105" y2="230" stroke="#ea580c" stroke-width="1.5" marker-end="url(#b)"/>
    <line x1="260" y1="182" x2="260" y2="230" stroke="#ea580c" stroke-width="1.5" marker-end="url(#b)"/>
    <text x="270" y="214" fill="#ea580c" font-size="12">"+ billing" goes here</text>

    <!-- memory -->
    <rect x="45" y="340" width="430" height="52" rx="10" fill="#fafaf9" stroke="#d6d3d1"/>
    <text x="260" y="362" text-anchor="middle" fill="#44403c" font-size="13">Memory: service conventions, owners, commitments</text>
    <text x="260" y="381" text-anchor="middle" fill="#78716c" font-size="11.5">Shared across tasks; recalled as facts, not orders</text>

    <!-- speak -->
    <rect x="45" y="432" width="430" height="52" rx="10" fill="#ffedd5" stroke="#ea580c"/>
    <text x="260" y="454" text-anchor="middle" fill="#7c2d12" font-size="13">Speak with results, and mind who is in the room</text>
    <text x="260" y="473" text-anchor="middle" fill="#9a3412" font-size="11.5">Skip raw log dumps; keep DM details out of public chat</text>
    <line x1="260" y1="292" x2="260" y2="338" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="260" y1="392" x2="260" y2="430" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#b)"/>
  </g>

  <!-- AGENT column -->
  <g transform="translate(658,100)">
    <rect x="0" y="20" width="150" height="40" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="75" y="45" text-anchor="middle" fill="#134e4a" font-size="12">Channel root msg</text>
    <rect x="172" y="20" width="160" height="40" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="252" y="45" text-anchor="middle" fill="#134e4a" font-size="12">Task report / follow-up</text>
    <rect x="354" y="20" width="166" height="40" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="437" y="45" text-anchor="middle" fill="#134e4a" font-size="12">Schedule / event</text>

    <rect x="45" y="120" width="430" height="62" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="260" y="145" text-anchor="middle" fill="#134e4a" font-weight="600" font-size="13.5">Place coordinator: attach, start, or ignore</text>
    <text x="260" y="168" text-anchor="middle" fill="#115e59" font-size="11.5">Holds work-board index (local + permitted); pulls detail on demand</text>
    <line x1="75" y1="60" x2="180" y2="118" stroke="#6b7280" stroke-width="1.5" marker-end="url(#b)"/>
    <line x1="252" y1="60" x2="256" y2="118" stroke="#6b7280" stroke-width="1.5" marker-end="url(#b)"/>
    <line x1="437" y1="60" x2="340" y2="118" stroke="#6b7280" stroke-width="1.5" marker-end="url(#b)"/>

    <rect x="12" y="232" width="152" height="60" rx="10" fill="#ffffff" stroke="#5eead4"/>
    <text x="88" y="256" text-anchor="middle" fill="#134e4a" font-size="13.5">task · PR #412</text>
    <text x="88" y="276" text-anchor="middle" fill="#0f766e" font-size="11">Own context, tools, sandbox</text>
    <rect x="184" y="232" width="152" height="60" rx="10" fill="#ffffff" stroke="#5eead4"/>
    <text x="260" y="256" text-anchor="middle" fill="#134e4a" font-size="13.5">task · rollback</text>
    <text x="260" y="276" text-anchor="middle" fill="#0f766e" font-size="11">Own context, sibling-aware</text>
    <rect x="356" y="232" width="152" height="60" rx="10" fill="#ffffff" stroke="#5eead4" stroke-dasharray="5 3"/>
    <text x="432" y="256" text-anchor="middle" fill="#134e4a" font-size="13.5">follow-up · patrol</text>
    <text x="432" y="276" text-anchor="middle" fill="#0f766e" font-size="11">Wakes on time or event</text>
    <line x1="185" y1="182" x2="105" y2="230" stroke="#0d9488" stroke-width="1.5" marker-end="url(#b)"/>
    <line x1="260" y1="182" x2="260" y2="230" stroke="#0d9488" stroke-width="1.5" marker-end="url(#b)"/>
    <text x="270" y="214" fill="#0d9488" font-size="12">Routes to existing task</text>

    <rect x="45" y="340" width="430" height="52" rx="10" fill="#fafaf9" stroke="#d6d3d1"/>
    <text x="260" y="362" text-anchor="middle" fill="#44403c" font-size="13">Memory: audience-scoped (person / place / shared)</text>
    <text x="260" y="381" text-anchor="middle" fill="#78716c" font-size="11.5">Shared within visibility scope; marked as data, not orders</text>

    <rect x="40" y="432" width="440" height="52" rx="10" fill="#ccfbf1" stroke="#0d9488"/>
    <text x="260" y="454" text-anchor="middle" fill="#134e4a" font-size="12.5">Tasks reply in-thread; coordinator handles quick Qs &amp; relays</text>
    <text x="260" y="473" text-anchor="middle" fill="#115e59" font-size="11.5">Intermediate steps stay in the task, out of coordinator context</text>
    <line x1="260" y1="292" x2="260" y2="338" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="260" y1="392" x2="260" y2="430" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#b)"/>
  </g>

  <line x1="600" y1="100" x2="600" y2="590" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 4"/>
</svg>
